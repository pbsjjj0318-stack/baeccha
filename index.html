<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>배차시간 및 식단표</title>
<meta name="description" content="대진여객 시내버스 배차 조회">
<meta name="theme-color" content="#1d4ed8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="배차시간 및 식단표">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="app.css?v=85">
</head>
<body>

<header class="topbar">
  <div class="toprow">
    <h1 class="brand"><img class="bus" src="icons/bus.png" alt="" width="28" height="28"><span>배차시간 및 식단표</span></h1>
    <span class="corp">대진여객</span>
  </div>
  <p class="sub" id="topSub"></p>
</header>

<main id="viewMine" class="view">
  <div class="personbar">
    <button id="personBtn" class="personbtn" type="button" aria-haspopup="dialog">
      <span class="ico">👤</span><span id="personName">박병수</span><span class="caret">▾</span>
    </button>
    <span class="personhint">이름을 눌러 다른 기사님 배차도 볼 수 있어요</span>
  </div>
  <div id="mine"></div>
  <p class="footnote" id="mineFoot"></p>
</main>

<main id="viewLookup" class="view" hidden>
  <div class="field">
    <div class="label">날짜</div>
    <div class="chips" id="dateChips"></div>
  </div>
  <div class="field">
    <div class="label">노선</div>
    <div class="chips" id="routeChips"></div>
  </div>
  <div class="segmented" id="shiftSeg" role="tablist" aria-label="오전 오후">
    <button type="button" data-shift="am" role="tab">오전</button>
    <button type="button" data-shift="pm" role="tab">오후</button>
  </div>
  <div class="personnote" id="lookupNote" hidden></div>
  <div class="listhead" id="listHead"></div>
  <div class="rows" id="rows"></div>
  <p class="footnote" id="lookupFoot"></p>
</main>

<main id="viewAll" class="view" hidden>
  <div class="field">
    <input id="allFind" class="search" type="search" inputmode="numeric" placeholder="차량번호로 찾기 (예: 64)" autocomplete="off" enterkeyhint="search">
  </div>
  <div class="field">
    <div class="label">날짜</div>
    <div class="chips" id="allDateChips"></div>
  </div>
  <div class="field">
    <div class="label">노선</div>
    <div class="chips" id="allRouteChips"></div>
  </div>
  <div class="listhead" id="allHead"></div>
  <div class="allrows" id="allRows"></div>
  <p class="footnote" id="allFoot"></p>
</main>

<main id="viewMenu" class="view" hidden>
  <div class="field">
    <div class="label">주</div>
    <div class="chips" id="weekChips"></div>
  </div>
  <div class="listhead" id="menuHead"></div>
  <div id="menuDays"></div>
  <p class="footnote" id="menuFoot"></p>
</main>

<nav class="tabbar">
  <button class="tab active" type="button" data-tab="mine"><span class="ti">🚌</span>내 배차</button>
  <button class="tab" type="button" data-tab="lookup"><span class="ti">🔎</span>전체 조회</button>
  <button class="tab" type="button" data-tab="menu"><span class="ti">🍚</span>주간 식단표</button>
</nav>

<div class="sheetwrap" id="sheetWrap" hidden>
  <div class="sheetbackdrop" data-close="1"></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-label="이름 선택">
    <div class="sheethead">
      <strong id="sheetTitle">이름 선택</strong>
      <span class="sheetacts">
        <button class="sheetme" id="sheetMeBtn" type="button">내 이름 저장하기</button>
        <button class="sheetclose" type="button" data-close="1">닫기</button>
      </span>
    </div>
    <div class="searchnote setupnote" id="sheetNote" hidden></div>
    <div class="searchrow">
      <input id="nameSearch" class="search" type="search" placeholder="이름으로 찾기" autocomplete="off" enterkeyhint="search">
      <button class="micbtn" id="nameMic" type="button" aria-label="음성으로 이름 찾기" title="말해서 찾기">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3.5 3.5 0 0 0 3.5-3.5V6a3.5 3.5 0 0 0-7 0v5.5A3.5 3.5 0 0 0 12 15Z"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3M9 21h6"/></svg>
      </button>
    </div>
    <div class="searchnote">마이크를 누르고 이름을 말해도 찾을 수 있어요.</div>
    <div class="searchhint" id="nameHint" hidden></div>
    <div class="namelist" id="nameList"></div>
  </div>
</div>

<script src="app.js?v=94"></script>
</body>
</html>
